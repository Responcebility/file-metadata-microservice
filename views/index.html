<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>File Metadata Microservice</title>

  <link rel="stylesheet" href="/public/style.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 40px;
      max-width: 800px;
    }

    h1 {
      color: #333;
    }

    form {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }

    input[type=file] {
      display: block;
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    code {
      background: #eee;
      padding: 2px 5px;
    }
  </style>

</head>

<body>

  <h1>File Metadata Microservice</h1>

  <p>Select a file and upload it.</p>

  <form
    action="/api/fileanalyse"
    method="post"
    enctype="multipart/form-data">

    <input
      type="file"
      name="upfile"
      required>

    <button type="submit">
      Upload File
    </button>

  </form>

  <hr>

  <h3>API Endpoint</h3>

  <code>POST /api/fileanalyse</code>

</body>

</html>
